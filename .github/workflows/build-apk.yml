name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Compilar
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace -DskipFormatKtlint 2>&1 | tee build.log

      - name: Enviar log do erro
        if: failure()
        shell: bash
        run: |
          grep -n -B2 -A8 -E "error:|FAILED|What went wrong|e: " build.log | head -400 > erro.txt || true
          tail -150 build.log >> erro.txt
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf --cached . > /dev/null
          git add -f erro.txt
          git commit -m "Log do build ${{ github.run_number }}"
          git push -f origin build-log

      - name: Renomear APK
        run: |
          mkdir -p saida
          cp app/build/outputs/apk/debug/*.apk saida/Louvor.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v7
        with:
          name: Louvor-apk
          path: saida/Louvor.apk

      - name: Publicar na página de Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Louvor (build ${{ github.run_number }})
          body: Toque em Louvor.apk abaixo para baixar e instalar no celular.
          files: saida/Louvor.apk
